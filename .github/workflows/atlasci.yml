name: CI CD Workflow Atlas 2.0

on:
  workflow_dispatch: # Permite ejecutar el workflow manualmente desde la web
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ develop, master ]

jobs:
  security:
    name: Auditoria de Seguridad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=high

  lint-and-types:
    name: Calidad de Codigo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  unit-tests:
    name: Tests Unitarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  build:
    name: Compilacion del Proyecto
    runs-on: ubuntu-latest
    needs: [ lint-and-types, unit-tests ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build